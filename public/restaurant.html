<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Restoran QR</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tenant = params.get('tenant_id') || 'aeon';
    const target = params.get('target') || 'Table-Bahçe 1';
    window.location.replace(`/guest.html?tenant_id=${encodeURIComponent(tenant)}&type=restaurant&target=${encodeURIComponent(target)}`);
  </script>
</head>
<body></body>
</html>
