<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEON ERP | Yönlendiriliyor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/aeon-tokens.css">
  <link rel="stylesheet" href="/css/aeon-base.css">
  <script src="/js/boot.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-canvas);
      margin: 0;
      font-family: var(--font-body);
    }
    .loader-box {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(2, 132, 199, 0.1);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .text {
      color: var(--color-text-muted);
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <div class="text">Kullanıcı oturumu çözümleniyor...</div>
  </div>
</body>
</html>
