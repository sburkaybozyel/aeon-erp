<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teknik Servis | Personel Portalı</title>
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="/css/aeon-tokens.css">
  <link rel="stylesheet" href="/css/aeon-base.css">
  <link rel="stylesheet" href="/css/aeon-shell.css">
  <link rel="stylesheet" href="/css/aeon-components.css">
  <link rel="stylesheet" href="/css/aeon-responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="/js/boot.js"></script>
</head>
<body class="mobile-app-container">

  <header class="mobile-header liquid-glass-panel">
    <div class="mobile-title" id="maintenance-title">Teknik Servis / Bakım</div>
    <button class="btn-close-modal" id="btn-staff-logout" onclick="window.aeonLogout(); return false;" style="color: var(--color-danger); background:none; border:none; font-size:18px; cursor:pointer;" title="Çıkış">
      <i class="fa-solid fa-power-off"></i>
    </button>
  </header>

  <main class="mobile-content">
    
    <!-- Tab 1: Arızalar (Görevler) -->
    <div id="tech-subview-tasks" class="panel-section active" style="padding-bottom: 80px;">
      <div class="d-flex justify-content-between align-items-center" style="margin-bottom: 12px;">
        <h4 style="font-size: 13px; text-transform: uppercase; color: var(--color-primary); font-weight: 800; margin: 0;">Teknik İş Talepleri</h4>
        <button class="btn btn-primary btn-sm" id="btn-create-tech-task"><i class="fa-solid fa-plus"></i> Arıza Bildir</button>
      </div>
      <div class="d-flex flex-column" style="gap: 12px;" id="staff-tech-tasks-list"></div>
    </div>

    <!-- Tab 2: Odalar (AC & Tadilat durumları) -->
    <div id="tech-subview-rooms" class="panel-section" style="padding-bottom: 80px;">
      <h4 style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; color: var(--color-primary);">Oda Donanım & Klima Takibi</h4>
      <div class="room-rack-grid" id="staff-tech-rooms-grid"></div>
    </div>

    <!-- Tab 3: Rutin Rutinler -->
    <div id="tech-subview-routine" class="panel-section" style="padding-bottom: 80px;">
      <h4 style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; color: var(--color-primary);">Periyodik Rutin Kontroller</h4>
      <div class="d-flex flex-column" style="gap: 12px;" id="staff-tech-routine-list"></div>
    </div>

    <!-- Tab 4: Depo & Talepler -->
    <div id="tech-subview-inventory" class="panel-section" style="padding-bottom: 80px;">
      <div class="d-flex justify-content-between align-items-center" style="margin-bottom: 12px;">
        <h4 style="font-size: 13px; text-transform: uppercase; color: var(--color-primary); font-weight: 800; margin: 0;">Teknik Malzeme Deposu</h4>
        <button class="btn btn-primary btn-sm" id="btn-trigger-tech-pr"><i class="fa-solid fa-plus"></i> Malzeme İste</button>
      </div>
      <div class="card" style="padding: 12px; margin-bottom: 16px;">
        <div class="table-responsive">
          <table class="table small">
            <thead>
              <tr><th>Malzeme</th><th>Stok</th><th>Birim</th></tr>
            </thead>
            <tbody id="staff-tech-inventory-body"></tbody>
          </table>
        </div>
      </div>

      <h4 style="font-size: 13px; text-transform: uppercase; color: var(--color-primary); font-weight: 800; margin-bottom: 8px;">Malzeme Taleplerim</h4>
      <div id="tech-purchase-requests-list" class="d-flex flex-column" style="gap: 8px;"></div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="mobile-bottom-nav">
    <a href="#" class="nav-item active" id="nav-tech-tab-tasks">
      <i class="fa-solid fa-screwdriver-wrench"></i>
      <span>Arızalar</span>
    </a>
    <a href="#" class="nav-item" id="nav-tech-tab-rooms">
      <i class="fa-solid fa-bed"></i>
      <span>Odalar</span>
    </a>
    <a href="#" class="nav-item" id="nav-tech-tab-routine">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>Rutinler</span>
    </a>
    <a href="#" class="nav-item" id="nav-tech-tab-inventory">
      <i class="fa-solid fa-boxes-stacked"></i>
      <span>Depo</span>
    </a>
  </nav>

  <!-- ROOM DETAIL MODAL -->
  <div class="modal-overlay" id="room-detail-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-room-title">Oda Bakımı</h3>
        <button class="btn-close-modal" id="btn-close-room-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Oda Durumu</label>
          <select id="modal-room-status">
            <option value="clean_vacant">Temiz (Boş)</option>
            <option value="dirty_vacant">Kirli (Boş)</option>
            <option value="occupied">Dolu</option>
            <option value="maintenance">Bakımda / Tadilat</option>
          </select>
        </div>
        <div class="form-group">
          <label>Klima Durumu</label>
          <select id="modal-room-ac">
            <option value="working">🟢 Klima Çalışıyor</option>
            <option value="broken">🔴 Klima Arızalı</option>
          </select>
        </div>
        <div class="form-group">
          <label>Arıza Notu / Tamirat Detayı</label>
          <input type="text" id="modal-room-notes" placeholder="Tadilat veya arıza açıklaması...">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" id="btn-cancel-room-modal">Kapat</button>
        <button class="btn btn-primary btn-sm" id="btn-save-room-modal">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- TECH PURCHASE REQUEST MODAL -->
  <div class="modal-overlay" id="tech-pr-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Yeni Malzeme Talebi</h3>
        <button class="btn-close-modal" id="btn-close-pr-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <form id="tech-form-pr">
          <div class="form-group">
            <label>Malzeme Seç</label>
            <select id="tech-pr-item" required></select>
          </div>
          <div class="form-group">
            <label>Miktar</label>
            <input type="number" id="tech-pr-qty" placeholder="Adet / Paket" required>
          </div>
          <div class="form-group">
            <label>Açıklama / Not</label>
            <input type="text" id="tech-pr-notes" placeholder="Hangi arıza için?">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Talep Gönder</button>
        </form>
      </div>
    </div>
  </div>

  <!-- CREATE TASK MODAL (To report fault from inside the portal) -->
  <div class="modal-overlay" id="create-task-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Yeni Arıza Bildir</h3>
        <button class="btn-close-modal" id="btn-close-task-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="modal-task-type" value="maintenance_request">
        <div class="form-group">
          <label>Oda / Konum Seçimi</label>
          <input type="hidden" id="modal-task-room" value="">
          <div id="modal-task-room-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; max-height: 180px; overflow-y: auto; padding: 4px; border: 1px solid var(--border-glass); border-radius: 4px;"></div>
        </div>
        <div class="form-group">
          <label>Arıza Detayı</label>
          <textarea id="modal-task-details" rows="3" placeholder="Arıza detayını buraya yazın..." required></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" id="btn-cancel-task-modal">İptal</button>
        <button class="btn btn-primary btn-sm" id="btn-submit-task-modal">Talebi Kaydet</button>
      </div>
    </div>
  </div>

  <script src="/js/maintenance-entry.js" type="module"></script>
</body>
</html>
