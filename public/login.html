<!DOCTYPE html>
<html lang="tr" class="aeon-auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Giriş - Aeon ERP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/brands/aeon/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/brands/aeon/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hotel Staff">
  <meta name="theme-color" content="#078fd0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/aeon-tokens.css">
  <link rel="stylesheet" href="/css/aeon-base.css">
  <link rel="stylesheet" href="/css/aeon-shell.css">
  <link rel="stylesheet" href="/css/aeon-components.css">
  <link rel="stylesheet" href="/css/aeon-responsive.css">
  <script src="/js/boot.js"></script>
  <script>
    const savedTheme = localStorage.getItem('theme_preference');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  </script>
  <style>
    body {
      background: var(--bg-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Hidden until boot.js confirms there is no valid session — prevents the
       PIN pad from being visible/tappable while a redirect to the already
       logged-in staff portal is still in flight. */
    html.aeon-auth-pending .login-container {
      visibility: hidden;
    }
    
    .login-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-premium);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    
    .login-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border-radius: var(--radius-md);
      object-fit: contain;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--color-text-main);
      text-align: center;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-align: center;
    }

    .error-msg {
      color: #ff4d4f;
      font-size: 14px;
      font-weight: 600;
      min-height: 24px;
      margin-bottom: 16px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .error-shake {
      animation: shake 0.4s ease-in-out;
    }

    .pin-display {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      justify-content: center;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--border-glass-active);
      transition: all 0.2s ease;
    }

    .pin-dot.filled {
      background-color: var(--color-primary);
      box-shadow: 0 0 10px var(--color-primary);
      transform: scale(1.2);
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 24px;
    }

    .numpad-btn {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 1px solid var(--border-glass);
      background: rgba(255,255,255,0.03);
      color: var(--color-text-main);
      font-size: 24px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.1s ease;
    }

    .numpad-btn:active {
      transform: scale(0.9);
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .numpad-btn.action {
      background: transparent;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
    }
    
    .numpad-btn.action:active {
      color: var(--color-danger);
    }

    .error-msg {
      color: var(--color-danger);
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <img id="login-logo" src="/brands/aeon/logo.png" alt="Logo" class="login-logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjEpIi8+PHRleHQgeD0iNTAiIHk9IjYwIiBmb250LWZhbWlseT0iT3V0Zml0IiBmb250LXNpemU9IjMwIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTwvdGV4dD48L3N2Zz4='">
      
      <div class="login-title" id="login-brand-name">Aeon ERP</div>
      <div class="login-subtitle">Devam etmek için 4 haneli PIN girin</div>
      
      <div class="error-msg" id="error-message"></div>

      <div class="pin-display" id="pin-display">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>

      <div class="numpad" id="numpad">
        <button class="numpad-btn" data-val="1">1</button>
        <button class="numpad-btn" data-val="2">2</button>
        <button class="numpad-btn" data-val="3">3</button>
        <button class="numpad-btn" data-val="4">4</button>
        <button class="numpad-btn" data-val="5">5</button>
        <button class="numpad-btn" data-val="6">6</button>
        <button class="numpad-btn" data-val="7">7</button>
        <button class="numpad-btn" data-val="8">8</button>
        <button class="numpad-btn" data-val="9">9</button>
        <div style="visibility: hidden;"></div>
        <button class="numpad-btn" data-val="0">0</button>
        <button class="numpad-btn action" id="btn-delete"><i class="fa-solid fa-delete-left"></i></button>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let currentPin = '';
      let pushEnrollment = null;
      const pinDots = document.querySelectorAll('.pin-dot');
      const errorMsg = document.getElementById('error-message');

      function beginPushEnrollment() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window) || !window.isSecureContext) return Promise.resolve(null);
        const permission = Notification.permission === 'default' ? Notification.requestPermission() : Promise.resolve(Notification.permission);
        return navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(() => Promise.all([navigator.serviceWorker.ready, permission]))
          .then(([registration, value]) => value === 'granted' ? registration : null)
          .catch(() => null);
      }

      async function completePushEnrollment(registration) {
        if (!registration) return;
        const keyResponse = await fetch('/api/push/public-key');
        const keyData = await keyResponse.json();
        if (!keyData.publicKey) return;
        const key = Uint8Array.from(atob(keyData.publicKey.replace(/-/g, '+').replace(/_/g, '/')), value => value.charCodeAt(0));
        let subscription = await registration.pushManager.getSubscription();
        const registeredKey = subscription?.options?.applicationServerKey ? new Uint8Array(subscription.options.applicationServerKey) : null;
        const keyMatches = registeredKey && registeredKey.length === key.length && registeredKey.every((value, index) => value === key[index]);
        if (subscription && !keyMatches) {
          await subscription.unsubscribe();
          subscription = null;
        }
        subscription = subscription || await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
        const response = await fetch('/api/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subscription }) });
        if (!response.ok) throw new Error('Bildirim kaydı yapılamadı.');
      }

      function updateDots() {
        pinDots.forEach((dot, index) => {
          if (index < currentPin.length) {
            dot.classList.add('filled');
          } else {
            dot.classList.remove('filled');
          }
        });
      }

      async function attemptLogin() {
        const enrollment = pushEnrollment || beginPushEnrollment();
        try {
          const res = await fetch(`/api/auth/login?tenant_id=${window.tenantId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: currentPin })
          });
          
          const data = await res.json();
          
          if (res.ok) {
            // Session is saved in HttpOnly cookie automatically by server
            window.aeonUser = data.user;
            if (data.token) {
              localStorage.setItem('aeon_session_token', data.token);
              window.aeonSessionToken = data.token;
            }
            await completePushEnrollment(await enrollment).catch(() => null);
            
            // Redirect based on role
            const role = (data.user.role || '').toLowerCase();
            if (role === 'reception' || role === 'resepsiyon') {
              window.location.href = `/staff-reception.html?tenant_id=${window.tenantId}`;
            } else if (role === 'housekeeping') {
              window.location.href = `/staff-housekeeping.html?tenant_id=${window.tenantId}`;
            } else if (role === 'restaurant' || role === 'waiter') {
              window.location.href = `/staff-restaurant.html?tenant_id=${window.tenantId}`;
            } else if (role === 'bar' || role === 'barmen' || role === 'bartender') {
              window.location.href = `/staff-bar.html?tenant_id=${window.tenantId}`;
            } else if (role === 'kitchen' || role === 'chef') {
              window.location.href = `/staff-kitchen.html?tenant_id=${window.tenantId}`;
            } else if (role === 'maintenance' || role === 'technical') {
              window.location.href = `/staff-maintenance.html?tenant_id=${window.tenantId}`;
            } else if (role === 'admin' || role === 'manager' || role === 'yönetici') {
              window.location.href = `/index.html?tenant_id=${window.tenantId}`;
            } else {
              await window.aeonLogout();
            }
          } else {
            errorMsg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Hatalı PIN! Lütfen tekrar deneyin.';
            currentPin = '';
            updateDots();
            const display = document.getElementById('pin-display');
            display.classList.remove('error-shake');
            void display.offsetWidth; // trigger reflow
            display.classList.add('error-shake');
          }
        } catch (err) {
          errorMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Bağlantı hatası! Tekrar deneyin.';
          currentPin = '';
          updateDots();
        }
      }

      document.querySelectorAll('.numpad-btn[data-val]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (currentPin.length < 4) {
            currentPin += btn.dataset.val;
            errorMsg.textContent = '';
            updateDots();
            
            if (currentPin.length === 4) {
              pushEnrollment = beginPushEnrollment();
              setTimeout(attemptLogin, 100);
            }
          }
        });
      });

      document.getElementById('btn-delete').addEventListener('click', () => {
        if (currentPin.length > 0) {
          currentPin = currentPin.slice(0, -1);
          updateDots();
          errorMsg.textContent = '';
        }
      });
      
      // Keyboard support
      window.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
          if (currentPin.length < 4) {
            currentPin += e.key;
            errorMsg.textContent = '';
            updateDots();
            if (currentPin.length === 4) {
              pushEnrollment = beginPushEnrollment();
              setTimeout(attemptLogin, 100);
            }
          }
        } else if (e.key === 'Backspace') {
          if (currentPin.length > 0) {
            currentPin = currentPin.slice(0, -1);
            updateDots();
            errorMsg.textContent = '';
          }
        }
      });
    });
  </script>
</body>
</html>
