<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Restoran & POS | Personel Portalı</title>
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="/css/aeon-tokens.css">
  <link rel="stylesheet" href="/css/aeon-base.css">
  <link rel="stylesheet" href="/css/aeon-shell.css">
  <link rel="stylesheet" href="/css/aeon-components.css">
  <link rel="stylesheet" href="/css/aeon-responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="/js/boot.js"></script>
</head>
<body class="mobile-app-container">

  <header class="mobile-header liquid-glass-panel">
    <div class="mobile-title" id="restaurant-title">Restoran (Servis)</div>
    <button class="btn-close-modal" id="btn-staff-logout" onclick="window.aeonLogout(); return false;" style="color: var(--color-danger); background:none; border:none; font-size:18px; cursor:pointer;" title="Çıkış">
      <i class="fa-solid fa-power-off"></i>
    </button>
  </header>

  <main class="mobile-content">
    
    <!-- Tab 1: Masalar -->
    <div id="restaurant-subview-tables" class="panel-section active" style="padding-bottom: 80px;">
      <h4 style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; color: var(--color-primary);">Masa Durumları</h4>
      <!-- Flex layout table status rack -->
      <div class="room-rack-grid" id="staff-restaurant-tables-grid"></div>
    </div>

    <!-- Tab 2: Servis Bekleyenler -->
    <div id="restaurant-subview-service" class="panel-section" style="padding-bottom: 80px;">
      <h4 style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; color: var(--color-primary);"><i class="fa-solid fa-bell"></i> Servis Bekleyen Hazır Ürünler</h4>
      <div class="d-flex flex-column" style="gap: 12px;" id="staff-restaurant-ready-grid"></div>
    </div>

    <!-- Tab 3: Sipariş Al -->
    <div id="restaurant-subview-order" class="panel-section" style="padding-bottom: 150px;">
      <!-- Ordering header details -->
      <div class="card" style="padding: 12px; margin-bottom: 16px; background: var(--bg-surface-secondary);">
        <label style="margin-bottom: 6px; font-weight: bold; font-size: 11px;">Hedef Masa/Oda</label>
        <select id="staff-restaurant-order-target"></select>
      </div>

      <!-- Categories row -->
      <div class="rack-filter-bar" style="margin-bottom: 12px;">
        <button class="pos-category-btn active" id="btn-cat-all">Tümü</button>
        <button class="pos-category-btn" id="btn-cat-food">Yemek</button>
        <button class="pos-category-btn" id="btn-cat-drink">İçecek</button>
        <button class="pos-category-btn" id="btn-cat-minibar">Minibar</button>
      </div>

      <!-- Catalog items list -->
      <div class="pos-products-grid" id="menu-items-grid"></div>

      <!-- Cart panel floating at bottom of ordering tab -->
      <div class="card" id="staff-restaurant-cart-card" style="display: none; margin-top: 16px; padding: 12px; background: var(--bg-surface);">
        <h4 style="font-size:12px; color: var(--color-primary); margin-bottom: 8px;"><i class="fa-solid fa-shopping-cart"></i> Sepet</h4>
        <div id="staff-restaurant-cart-items-list" style="font-size:12px; display:flex; flex-direction:column; gap:6px;"></div>
        <button class="btn btn-success btn-block btn-sm" id="btn-submit-cart" style="margin-top: 12px;">Siparişi Gönder</button>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="mobile-bottom-nav">
    <a href="#" class="nav-item active" id="nav-restaurant-tab-tables">
      <i class="fa-solid fa-table-cells"></i>
      <span>Masalar</span>
    </a>
    <a href="#" class="nav-item" id="nav-restaurant-tab-service">
      <i class="fa-solid fa-bell-concierge"></i>
      <span>Servis</span>
    </a>
    <a href="#" class="nav-item" id="nav-restaurant-tab-order">
      <i class="fa-solid fa-cart-plus"></i>
      <span>Sipariş Al</span>
    </a>
  </nav>

  <!-- TABLE DETAIL MODAL -->
  <div class="modal-overlay" id="table-detail-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="table-detail-title">Masa Adisyonu</h3>
        <button class="btn-close-modal" id="btn-close-table-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div id="table-detail-orders" class="d-flex flex-column" style="gap: 8px;"></div>
        <div class="d-flex justify-content-between align-items-center" style="margin-top:16px; padding-top:12px; border-top:1px solid var(--border-glass);">
          <strong>Toplam Tutar:</strong>
          <strong id="table-detail-total" style="font-size:20px; color:var(--color-primary);">0.00 TL</strong>
        </div>
        <div class="form-group" style="margin-top: 16px;">
          <label>Ödeme Yöntemi</label>
          <select id="table-payment-method">
            <option value="cash">Nakit (TRY)</option>
            <option value="credit_card">Kredi Kartı</option>
            <option value="room_charge">Oda Hesabına Yaz</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" id="btn-cancel-table-modal">Kapat</button>
        <button class="btn btn-success btn-sm" id="btn-collect-table-payment">Ödemeyi Al</button>
      </div>
    </div>
  </div>

  <script src="/js/restaurant-entry.js?v=20260803-4"></script>
</body>
</html>
