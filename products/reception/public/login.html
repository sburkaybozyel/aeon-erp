<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Giriş - AEON ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/aeon-tokens.css">
  <link rel="stylesheet" href="/css/aeon-base.css">
  <link rel="stylesheet" href="/css/aeon-shell.css">
  <link rel="stylesheet" href="/css/aeon-components.css">
  <link rel="stylesheet" href="/css/aeon-responsive.css">
  <script src="/js/boot.js"></script>
  <script>
    const savedTheme = localStorage.getItem('theme_preference');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%), var(--bg-canvas);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: var(--font-body);
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .login-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), var(--glass-glow);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      padding: 44px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 60%);
      pointer-events: none;
    }
    
    .login-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: var(--radius-md);
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(14, 165, 233, 0.4));
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .login-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 28px;
      text-align: center;
    }

    .pin-display {
      display: flex;
      gap: 14px;
      margin-bottom: 28px;
      justify-content: center;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pin-dot.filled {
      background-color: var(--color-bright-blue);
      border-color: #ffffff;
      box-shadow: 0 0 16px var(--color-bright-blue);
      transform: scale(1.25);
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 12px;
    }

    .numpad-btn {
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(8px);
    }

    .numpad-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .numpad-btn:active {
      transform: scale(0.92);
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
      box-shadow: var(--glass-glow);
    }

    .numpad-btn.action {
      background: transparent;
      border: none;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.6);
    }
    
    .numpad-btn.action:hover {
      color: #ffffff;
      background: transparent;
    }

    .numpad-btn.action:active {
      color: var(--color-danger);
    }

    .error-msg {
      color: var(--color-danger);
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <img id="login-logo" src="/brands/aeon/logo.svg" alt="Logo" class="login-logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjEpIi8+PHRleHQgeD0iNTAiIHk9IjYwIiBmb250LWZhbWlseT0iT3V0Zml0IiBmb250LXNpemU9IjMwIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTwvdGV4dD48L3N2Zz4='">
      
      <div class="login-title" id="login-brand-name">AEON Reception</div>
      <div class="login-subtitle">Devam etmek için 4 haneli PIN girin</div>
      
      <div class="error-msg" id="error-message" role="alert" aria-live="assertive"></div>

      <div class="pin-display" id="pin-display" role="status" aria-label="PIN girişi, 4 haneden girildi">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>

      <div class="numpad" id="numpad" role="group" aria-label="PIN tuş takımı">
        <button class="numpad-btn" data-val="1" aria-label="1">1</button>
        <button class="numpad-btn" data-val="2" aria-label="2">2</button>
        <button class="numpad-btn" data-val="3" aria-label="3">3</button>
        <button class="numpad-btn" data-val="4" aria-label="4">4</button>
        <button class="numpad-btn" data-val="5" aria-label="5">5</button>
        <button class="numpad-btn" data-val="6" aria-label="6">6</button>
        <button class="numpad-btn" data-val="7" aria-label="7">7</button>
        <button class="numpad-btn" data-val="8" aria-label="8">8</button>
        <button class="numpad-btn" data-val="9" aria-label="9">9</button>
        <div style="visibility: hidden;" aria-hidden="true"></div>
        <button class="numpad-btn" data-val="0" aria-label="0">0</button>
        <button class="numpad-btn action" id="btn-delete" aria-label="Sil"><i class="fa-solid fa-delete-left"></i></button>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let currentPin = '';
      const pinDots = document.querySelectorAll('.pin-dot');
      const errorMsg = document.getElementById('error-message');

      function updateDots() {
        pinDots.forEach((dot, index) => {
          if (index < currentPin.length) {
            dot.classList.add('filled');
          } else {
            dot.classList.remove('filled');
          }
        });
      }

      async function attemptLogin() {
        try {
          const res = await fetch(`/api/auth/login?tenant_id=${window.tenantId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: currentPin })
          });
          
          const data = await res.json();
          
          if (res.ok && data && data.success && data.user) {
            // Session is saved in HttpOnly cookie automatically by server
            window.aeonUser = data.user;
            
            // Redirect based on role
            const role = (data.user.role || '').toLowerCase();
            const portalByRole = {
              admin: '/staff-reception.html',
              manager: '/staff-reception.html',
              'yönetici': '/staff-reception.html',
              reception: '/staff-reception.html',
            };
            const portal = portalByRole[role] || '/login.html';
            window.location.href = `${portal}?tenant_id=${window.tenantId}`;
          } else {
            errorMsg.textContent = (data && data.error) ? data.error : 'Hatalı PIN!';
            currentPin = '';
            updateDots();
            // Shake animation
            const display = document.getElementById('pin-display');
            display.style.transform = 'translateX(-10px)';
            setTimeout(() => display.style.transform = 'translateX(10px)', 50);
            setTimeout(() => display.style.transform = 'translateX(-10px)', 100);
            setTimeout(() => display.style.transform = 'translateX(10px)', 150);
            setTimeout(() => display.style.transform = 'translateX(0)', 200);
          }
        } catch (err) {
          console.error('Login error:', err);
          errorMsg.textContent = err.message || 'Bağlantı hatası!';
          currentPin = '';
          updateDots();
        }
      }

      document.querySelectorAll('.numpad-btn[data-val]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (currentPin.length < 4) {
            currentPin += btn.dataset.val;
            errorMsg.textContent = '';
            updateDots();
            
            if (currentPin.length === 4) {
              setTimeout(attemptLogin, 100);
            }
          }
        });
      });

      document.getElementById('btn-delete').addEventListener('click', () => {
        if (currentPin.length > 0) {
          currentPin = currentPin.slice(0, -1);
          updateDots();
          errorMsg.textContent = '';
        }
      });
      
      // Keyboard support
      window.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
          if (currentPin.length < 4) {
            currentPin += e.key;
            errorMsg.textContent = '';
            updateDots();
            if (currentPin.length === 4) {
              setTimeout(attemptLogin, 100);
            }
          }
        } else if (e.key === 'Backspace') {
          if (currentPin.length > 0) {
            currentPin = currentPin.slice(0, -1);
            updateDots();
            errorMsg.textContent = '';
          }
        }
      });
    });
  </script>
</body>
</html>
