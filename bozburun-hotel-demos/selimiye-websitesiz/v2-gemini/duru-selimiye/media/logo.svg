<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  
  <defs>
    <!-- Rich Bullion Gold Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="20%" stop-color="#e5c158"/>
      <stop offset="45%" stop-color="#c99726"/>
      <stop offset="70%" stop-color="#8a6111"/>
      <stop offset="90%" stop-color="#d8a834"/>
      <stop offset="100%" stop-color="#fdf2c6"/>
    </linearGradient>

    <!-- Ring Specular Gradient -->
    <linearGradient id="goldRadial" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a6e18"/>
      <stop offset="35%" stop-color="#fff2c2"/>
      <stop offset="70%" stop-color="#c59424"/>
      <stop offset="100%" stop-color="#734f0c"/>
    </linearGradient>

    <!-- Midnight Obsidian Backdrop -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#152232"/>
      <stop offset="65%" stop-color="#09101a"/>
      <stop offset="100%" stop-color="#04070c"/>
    </radialGradient>

    <!-- Deep Emerald Backdrop for V2 -->
    <radialGradient id="emeraldBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b4634"/>
      <stop offset="65%" stop-color="#0c251b"/>
      <stop offset="100%" stop-color="#05140e"/>
    </radialGradient>
  </defs>

  
    <!-- Solid Dark Backdrop Medallion -->
    <circle cx="150" cy="150" r="146" fill="url(#emeraldBg)"/>
    <circle cx="150" cy="150" r="140" fill="none" stroke="url(#goldLinear)" stroke-width="3"/>
    <circle cx="150" cy="150" r="132" fill="none" stroke="url(#goldRadial)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="150" cy="150" r="125" fill="none" stroke="url(#goldLinear)" stroke-width="1.5"/>

    <!-- 4 Cardinal Gold Points -->
    <polygon points="150,11 154,19 146,19" fill="url(#goldLinear)"/>
    <polygon points="150,289 154,281 146,281" fill="url(#goldLinear)"/>
    <polygon points="11,150 19,154 19,146" fill="url(#goldLinear)"/>
    <polygon points="289,150 281,154 281,146" fill="url(#goldLinear)"/>
  
  
        <!-- DURU: Brilliant Faceted Diamond & Starburst -->
        <g transform="translate(150, 112)">
          <!-- Starburst Rays -->
          <line x1="0" y1="-50" x2="0" y2="-38" stroke="url(#goldLinear)" stroke-width="2"/>
          <line x1="0" y1="50" x2="0" y2="38" stroke="url(#goldLinear)" stroke-width="2"/>
          <line x1="-50" y1="0" x2="-38" y2="0" stroke="url(#goldLinear)" stroke-width="2"/>
          <line x1="50" y1="0" x2="38" y2="0" stroke="url(#goldLinear)" stroke-width="2"/>
          <!-- Diamond Facets -->
          <polygon points="0,-36 34,-2 0,44 -34,-2" fill="none" stroke="url(#goldLinear)" stroke-width="3.5"/>
          <polygon points="0,-36 17,-2 0,44 -17,-2" fill="none" stroke="url(#goldRadial)" stroke-width="2"/>
          <line x1="-34" y1="-2" x2="34" y2="-2" stroke="url(#goldLinear)" stroke-width="2.5"/>
          <circle cx="0" cy="-2" r="5" fill="url(#goldLinear)"/>
        </g>
        <text x="150" y="196" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="url(#goldLinear)" text-anchor="middle" letter-spacing="8">DURU</text>
        <text x="150" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#f9e8af" text-anchor="middle" letter-spacing="4">SELİMİYE</text>
      
</svg>