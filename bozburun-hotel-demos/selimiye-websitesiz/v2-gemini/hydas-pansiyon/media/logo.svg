<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
    
  <defs>
    <!-- Bullion Gold Linear Gradient -->
    <linearGradient id="l_gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="15%" stop-color="#ffe699"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="60%" stop-color="#9a7322"/>
      <stop offset="85%" stop-color="#eac66f"/>
      <stop offset="100%" stop-color="#735010"/>
    </linearGradient>
    
    <!-- Specular Platinum Gold Glow -->
    <linearGradient id="l_goldSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#805b18"/>
      <stop offset="30%" stop-color="#fdf3d1"/>
      <stop offset="70%" stop-color="#c59f42"/>
      <stop offset="100%" stop-color="#543c0f"/>
    </linearGradient>

    <!-- Deep Metallic Shadow Filter -->
    <filter id="l_emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Radial Dark Backdrop Glow -->
    <radialGradient id="l_darkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141f2e"/>
      <stop offset="70%" stop-color="#070c13"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <radialGradient id="l_lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#faf7f0"/>
      <stop offset="100%" stop-color="#f0ebe0"/>
    </radialGradient>
  </defs>
  
    
    <circle cx="150" cy="150" r="146" fill="url(#l_lightGlow)"/>
    <circle cx="150" cy="150" r="142" fill="none" stroke="url(#l_gold3D)" stroke-width="2.5"/>
    <circle cx="150" cy="150" r="134" fill="none" stroke="url(#l_goldSheen)" stroke-width="1" stroke-dasharray="3 3" opacity="0.9"/>
    <circle cx="150" cy="150" r="128" fill="none" stroke="url(#l_gold3D)" stroke-width="1.5"/>

    <!-- 4 Royal Jewels -->
    <circle cx="150" cy="16" r="3.5" fill="url(#l_gold3D)"/>
    <circle cx="150" cy="284" r="3.5" fill="url(#l_gold3D)"/>
    <circle cx="16" cy="150" r="3.5" fill="url(#l_gold3D)"/>
    <circle cx="284" cy="150" r="3.5" fill="url(#l_gold3D)"/>
  
    
        <!-- HYDAS: Ancient Carian Ionic Column Acropolis -->
        <g transform="translate(150, 112)" filter="url(#l_emboss)">
          <circle cx="-18" cy="-26" r="9" fill="none" stroke="url(#l_gold3D)" stroke-width="2.2"/>
          <circle cx="18" cy="-26" r="9" fill="none" stroke="url(#l_gold3D)" stroke-width="2.2"/>
          <rect x="-26" y="-35" width="52" height="7" fill="url(#l_gold3D)"/>
          <line x1="-14" y1="-17" x2="-14" y2="26" stroke="url(#l_gold3D)" stroke-width="2.5"/>
          <line x1="0" y1="-17" x2="0" y2="26" stroke="url(#l_goldSheen)" stroke-width="2"/>
          <line x1="14" y1="-17" x2="14" y2="26" stroke="url(#l_gold3D)" stroke-width="2.5"/>
          <rect x="-20" y="26" width="40" height="7" fill="url(#l_gold3D)"/>
        </g>
        <text x="150" y="196" font-family="'Cinzel', serif" font-size="22" font-weight="700" fill="url(#l_gold3D)" text-anchor="middle" letter-spacing="6" filter="url(#l_emboss)">HYDAS</text>
        <text x="150" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#143527" text-anchor="middle" letter-spacing="4">ANCIENT CARIA</text>
      
  </svg>