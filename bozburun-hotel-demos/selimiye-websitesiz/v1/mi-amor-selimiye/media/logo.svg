<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
    
  <defs>
    <!-- Bullion Gold Linear Gradient -->
    <linearGradient id="d_gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="15%" stop-color="#ffe699"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="60%" stop-color="#9a7322"/>
      <stop offset="85%" stop-color="#eac66f"/>
      <stop offset="100%" stop-color="#735010"/>
    </linearGradient>
    
    <!-- Specular Platinum Gold Glow -->
    <linearGradient id="d_goldSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#805b18"/>
      <stop offset="30%" stop-color="#fdf3d1"/>
      <stop offset="70%" stop-color="#c59f42"/>
      <stop offset="100%" stop-color="#543c0f"/>
    </linearGradient>

    <!-- Deep Metallic Shadow Filter -->
    <filter id="d_emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Radial Dark Backdrop Glow -->
    <radialGradient id="d_darkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141f2e"/>
      <stop offset="70%" stop-color="#070c13"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <radialGradient id="d_lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#faf7f0"/>
      <stop offset="100%" stop-color="#f0ebe0"/>
    </radialGradient>
  </defs>
  
    
    <circle cx="150" cy="150" r="146" fill="url(#d_darkGlow)"/>
    <circle cx="150" cy="150" r="142" fill="none" stroke="url(#d_gold3D)" stroke-width="2.5"/>
    <circle cx="150" cy="150" r="134" fill="none" stroke="url(#d_goldSheen)" stroke-width="1" stroke-dasharray="3 3" opacity="0.9"/>
    <circle cx="150" cy="150" r="128" fill="none" stroke="url(#d_gold3D)" stroke-width="1.5"/>

    <!-- 4 Royal Jewels -->
    <circle cx="150" cy="16" r="3.5" fill="url(#d_gold3D)"/>
    <circle cx="150" cy="284" r="3.5" fill="url(#d_gold3D)"/>
    <circle cx="16" cy="150" r="3.5" fill="url(#d_gold3D)"/>
    <circle cx="284" cy="150" r="3.5" fill="url(#d_gold3D)"/>
  
    
        <!-- MI AMOR: Interlocking Imperial Monogram & Coronet -->
        <g transform="translate(150, 114)" filter="url(#d_emboss)">
          <!-- Crown -->
          <path d="M-18 -38 L0 -50 L18 -38 L12 -34 L0 -42 L-12 -34 Z" fill="url(#d_gold3D)"/>
          <circle cx="0" cy="-54" r="3" fill="url(#d_gold3D)"/>
          <circle cx="-18" cy="-42" r="2.5" fill="url(#d_gold3D)"/>
          <circle cx="18" cy="-42" r="2.5" fill="url(#d_gold3D)"/>
          <!-- Interlocking MA Monogram -->
          <text x="0" y="22" font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="68" font-style="italic" font-weight="700" fill="url(#d_gold3D)" text-anchor="middle" letter-spacing="1">MA</text>
          <!-- Laurel Branches -->
          <path d="M-45 10 C-45 35 -20 48 0 48 C20 48 45 35 45 10" fill="none" stroke="url(#d_goldSheen)" stroke-width="2"/>
        </g>
        <text x="150" y="196" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="url(#d_gold3D)" text-anchor="middle" letter-spacing="6" filter="url(#d_emboss)">MI AMOR</text>
        <text x="150" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#fbf1ce" text-anchor="middle" letter-spacing="4">HOTEL & SUITES</text>
      
  </svg>